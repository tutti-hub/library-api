spring:
   
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.sqlite.JDBC
    username: ${SPRING_USERNAME}
    password: ${SPRING_PASSWORD}

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate.ddl-auto: update
    show-sql: true
    format-sql: true